# ERP Domain Pre-training config
# Stage: domain-adaptive pre-training on business/finance/ERP text
# Resume from: checkpoints/general/step_00060000  (after general English training)
#
# Run:
#   python train.py --config configs/erp.yaml \
#                   --resume checkpoints/general/step_00060000 \
#                   --tokenizer tokenizer
#
# Then SFT:
#   python finetune.py --stage sft --config configs/erp.yaml \
#                      --base-checkpoint checkpoints/erp/step_XXXXXXXX \
#                      --data data/erp_sft_train.jsonl \
#                      --tokenizer tokenizer \
#                      --checkpoint-dir checkpoints/erp_sft

model:
  vocab_size: 8192
  max_seq_len: 1024
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 4
  intermediate_size: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  attention_dropout: 0.0
  hidden_dropout: 0.0
  use_bias: false
  tie_word_embeddings: true
  use_flash_attention: true
  use_gradient_checkpointing: false
  initializer_range: 0.02

training:
  # Lower LR for domain-adaptive pre-training (avoids forgetting general English)
  learning_rate: 5.0e-5
  min_learning_rate: 5.0e-6
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 100            # short warmup — we resume from trained model
  max_steps: 41728             # 11728 (SFT base step) + 30000 ERP domain steps
  batch_size: 32
  gradient_accumulation_steps: 4
  micro_batch_size: 8
  dtype: bfloat16
  save_every_steps: 2000
  eval_every_steps: 2000
  log_every_steps: 10
  checkpoint_dir: checkpoints/erp
  keep_last_n_checkpoints: 3
  data_dir: data/erp           # Reuters + FinancePhraseBank + FinanceAlpaca + Sujet
  val_split: 0.01
  num_workers: 0               # 0 = Windows safe

rlhf:
  sft_learning_rate: 1.0e-5   # restored — warmup bug fixed so LR is now actually used
  sft_epochs: 25              # 72 pairs × 25 epochs = 225 steps; warmup now only 22 steps
  sft_batch_size: 8
  rm_learning_rate: 2.0e-5
  rm_epochs: 2
  rm_batch_size: 4
  dpo_beta: 0.1
  dpo_learning_rate: 5.0e-7
  dpo_epochs: 1
  ppo_learning_rate: 1.0e-5
  ppo_epochs: 4
  ppo_batch_size: 32
  ppo_mini_batch_size: 4
  kl_coef: 0.1
  clip_range: 0.2
  target_kl: 0.1
  num_cai_revisions: 2
