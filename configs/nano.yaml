model:
  vocab_size: 512          # updated at runtime by tokenizer
  max_seq_len: 128
  hidden_size: 128
  num_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 4
  intermediate_size: 512
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  attention_dropout: 0.0
  hidden_dropout: 0.0
  use_bias: false
  tie_word_embeddings: true
  use_flash_attention: false   # CPU: no Flash Attention
  use_gradient_checkpointing: false
  initializer_range: 0.02

training:
  learning_rate: 5.0e-4
  min_learning_rate: 5.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 20
  max_steps: 300
  batch_size: 4
  gradient_accumulation_steps: 1
  micro_batch_size: 4
  dtype: "float32"             # CPU: use float32
  save_every_steps: 300
  eval_every_steps: 50
  log_every_steps: 10
  checkpoint_dir: "checkpoints/nano"
  keep_last_n_checkpoints: 2
  data_dir: "data/processed"
  val_split: 0.1
  num_workers: 0               # Windows: avoid DataLoader multiprocessing

rlhf:
  sft_learning_rate: 2.0e-5
  sft_epochs: 1
  sft_batch_size: 4
  rm_learning_rate: 2.0e-5
  rm_epochs: 1
  rm_batch_size: 4
  ppo_learning_rate: 1.0e-5
  ppo_epochs: 1
  ppo_batch_size: 4
  ppo_mini_batch_size: 2
  kl_coef: 0.1
  clip_range: 0.2
  target_kl: 0.1
  dpo_beta: 0.1
  dpo_learning_rate: 5.0e-7
  dpo_epochs: 1
  num_cai_revisions: 1
