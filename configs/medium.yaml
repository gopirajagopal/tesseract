# Medium model configuration — ~1B parameters
# Requires: 1–2 × A100 80GB or 4 × RTX 4090 with gradient checkpointing

model:
  vocab_size: 32000
  max_seq_len: 4096
  hidden_size: 2048
  num_layers: 24
  num_attention_heads: 16
  num_key_value_heads: 8           # GQA: 2 Q heads per KV head
  intermediate_size: 5504          # ≈ 2.7 × hidden_size
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  attention_dropout: 0.0
  hidden_dropout: 0.0
  use_bias: false
  tie_word_embeddings: true
  use_flash_attention: true
  use_gradient_checkpointing: true
  initializer_range: 0.02

training:
  learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 4000
  max_steps: 300000
  batch_size: 64
  gradient_accumulation_steps: 8
  micro_batch_size: 4
  dtype: bfloat16
  save_every_steps: 5000
  eval_every_steps: 1000
  log_every_steps: 10
  checkpoint_dir: checkpoints/medium
  keep_last_n_checkpoints: 3
  data_dir: data/processed
  val_split: 0.005
  num_workers: 8

rlhf:
  sft_learning_rate: 1.0e-5
  sft_epochs: 3
  sft_batch_size: 16
  rm_learning_rate: 1.0e-5
  rm_epochs: 2
  rm_batch_size: 16
  dpo_beta: 0.1
  dpo_learning_rate: 2.0e-7
  dpo_epochs: 3
  ppo_learning_rate: 5.0e-6
  ppo_epochs: 4
  ppo_batch_size: 64
  ppo_mini_batch_size: 8
  kl_coef: 0.05
  clip_range: 0.2
  target_kl: 0.05
  num_cai_revisions: 3
